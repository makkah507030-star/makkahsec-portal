<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>مشاهد تحديث فيديو البوابة</title>
<!--
  مشاهد التحديث لفيديو «خدمات البوابة» الأفقي (1920×1080) بنفس تصميم الفيديو الأول:
    ?s=intro  المقدمة «كل يوم في المدرسة… ماذا لو اجتمعت في مكان واحد؟» (7.6 ث، تنتهي بإطار الأصل نفسه)
    ?s=usage  الاستخدام الفعلي بالأرقام الجديدة (بدل «في ثلاثة أسابيع فقط»)
    ?s=new    08 الجديد في البوابة
    ?s=ach    09 إنجازات المدرسة
  الحركة كلها دالة في الزمن: window.render(ثانية) — يستدعيها rec.mjs إطارًا بإطار.
  أطوال مقاطع الصوت تُمرَّر في ?d=… (بالثواني، بترتيب أسطر المشهد) فيتزامن الإبراز معها.
  الصور (الإنجازات) في assets/ ولا تُرفع إلى المستودع.
-->
<style>

:root { --mint: #89D7AD; --deep: #3E6350; --tint: #EDFAF2; --light: #CCF2DB; --ink: #101010; --muted: #6B6B6B;
        --line: #C3C3C3; --warn: #9A7B22; --warnl: #FBF3DE; --abs: #A23B3B; }
* { box-sizing: border-box; margin: 0; padding: 0; }

/* الخلفية: تدرج أخضر داكن، توهج أعلى اليسار، شكل مستدير باهت أسفل اليسار، وخطوط مائلة دقيقة */
#bg { position: absolute; inset: 0; overflow: hidden;
  background:
    radial-gradient(1100px 760px at 4% 96%, rgba(70,120,90,.55), transparent 70%),

#bg .shape { position: absolute; width: 1100px; height: 640px; left: -380px; top: 620px; border-radius: 120px;

header { position: absolute; top: 46px; right: 74px; left: 70px; display: flex; align-items: center; z-index: 5; }

.stage { position: absolute; inset: 0; }

/* ===== صندوق المهام ===== */
.tasks { width: 820px; zoom: 1.08; }
.tasks .hd { display: flex; align-items: center; gap: 12px; padding: 22px 28px; border-bottom: 1px solid #e3e3e3; }
.tasks .hd b { font: 700 28px Plex; }
.tasks .hd .n { background: var(--warnl); color: var(--warn); font: 700 22px Plex; border-radius: 999px; padding: 2px 14px; }
.tasks .hd small { margin-right: auto; font: 400 17px Plex; color: #9a9a9a; }
.tasks .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; padding: 22px; }
.t { border-radius: 16px; border: 1.5px solid; padding: 18px; min-height: 172px; display: flex; flex-direction: column; }
.t .row { display: flex; justify-content: space-between; align-items: flex-start; }
.t .ic { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; }
.t .ic svg { width: 22px; height: 22px; }
.t .c { font: 700 40px/1 Plex; }
.t p { font: 600 19px/1.4 Plex; margin-top: 12px; }
.t i { font: 600 15px Plex; color: var(--deep); font-style: normal; margin-top: auto; padding-top: 8px; }
.t.w { border-color: rgba(154,123,34,.3); background: rgba(154,123,34,.05); } .t.w .ic { background: var(--warnl); color: var(--warn); } .t.w .c { color: var(--warn); }
.t.a { border-color: rgba(162,59,59,.25); background: rgba(162,59,59,.05); } .t.a .ic { background: rgba(162,59,59,.1); color: var(--abs); } .t.a .c { color: var(--abs); }
.t.m { border-color: var(--light); background: var(--tint); } .t.m .ic { background: #fff; color: var(--deep); } .t.m .c { color: var(--deep); }

/* ===== الطالب المفقود ===== */
.miss { width: 820px; }
.miss .hd { background: rgba(162,59,59,.07); padding: 22px 28px; display: flex; align-items: center; gap: 14px; border-bottom: 1px solid #eadada; }
.miss .hd b { font: 700 28px Plex; color: var(--abs); }
.miss .hd small { margin-right: auto; font: 400 18px Plex; color: var(--muted); }
.miss .st { padding: 22px 28px 8px; }
.miss .st b { font: 700 27px Plex; } .miss .st small { display: block; font: 400 19px Plex; color: var(--muted); margin-top: 2px; }
.tl { list-style: none; padding: 10px 28px 6px; }
.tl li { display: flex; align-items: center; gap: 16px; padding: 9px 0; border-bottom: 1px dashed #e5e5e5; font: 500 20px Plex; }
.tl li .p { width: 92px; color: var(--muted); }
.tl li .s { flex: 1; }
.tl li .k { font: 600 17px Plex; border-radius: 999px; padding: 3px 14px; }
.k.ok { background: var(--tint); color: var(--deep); } .k.no { background: rgba(162,59,59,.1); color: var(--abs); } .k.na { background: #f1f1f1; color: #8a8a8a; }
.tl li.after { background: linear-gradient(to left, rgba(162,59,59,.06), transparent); }
.miss .act { display: flex; gap: 12px; padding: 18px 28px 26px; }
.btn { border-radius: 12px; padding: 13px 24px; font: 700 20px Plex; }
.btn.pri { background: var(--deep); color: #fff; } .btn.ghost { border: 1.5px solid var(--line); color: var(--muted); }

/* ===== النموذج الرسمي ===== */
.paper { width: 560px; transform: rotate(-3deg); border-radius: 10px; }
.paper img { display: block; width: 100%; }
.stamp { position: absolute; left: 140px; bottom: 120px; background: var(--deep); color: #fff; border-radius: 16px;
  padding: 16px 24px; font: 700 22px Plex; box-shadow: 0 20px 50px -14px rgba(0,0,0,.6); display: flex; gap: 12px; align-items: center; }
.stamp2 { left: auto; right: 40px; bottom: auto; top: 110px; background: #fff; color: var(--deep); }

/* ===== اختبارات اليوم ===== */
.exam { width: 640px; }
.exam img { display: block; width: 100%; }

/* ===== رصد نور ===== */
.noor { width: 820px; }
.noor .hd { padding: 22px 28px 14px; } .noor .hd b { font: 700 28px Plex; } .noor .hd small { display: block; font: 400 18px Plex; color: var(--muted); }
.gr { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; padding: 4px 28px 16px; }
.gr div { border: 1.5px solid #ddd; border-radius: 14px; text-align: center; padding: 12px 0; font: 700 21px Plex; }
.gr div small { display: block; font: 400 17px Plex; color: var(--muted); }
.gr div.on { background: var(--deep); border-color: var(--deep); color: #fff; } .gr div.on small { color: rgba(255,255,255,.8); }
.cells { padding: 0 28px 24px; display: grid; grid-template-columns: 150px repeat(7, 1fr); gap: 6px; font: 600 17px Plex; }
.cells span { height: 38px; border-radius: 7px; display: grid; place-items: center; }
.cells .h { color: var(--muted); font-weight: 500; justify-content: start; }
.c1 { background: var(--light); color: var(--deep); } .c2 { background: var(--warnl); color: var(--warn); } .c3 { background: #FBEBEB; color: var(--abs); } .c0 { background: #f3f3f3; color: #aaa; }
.sub { position: absolute; left: 60px; bottom: 30px; width: 600px; padding: 20px 26px; display: flex; align-items: center; gap: 18px; }
.sub .pn { background: var(--tint); color: var(--deep); border-radius: 12px; padding: 10px 16px; font: 700 20px Plex; text-align: center; }
.sub b { font: 700 22px Plex; display: block; } .sub small { font: 600 18px Plex; color: var(--warn); }

/* ===== الإنجازات ===== */
.photo { position: absolute; border-radius: 22px; overflow: hidden; box-shadow: 0 30px 80px -20px rgba(0,0,0,.6); background: #fff; }
.photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
.photo.contain img { object-fit: contain; }
.cap { position: absolute; background: var(--mint); color: #16301F; border-radius: 999px; padding: 10px 22px; font: 700 21px Plex;
  box-shadow: 0 14px 30px -10px rgba(0,0,0,.5); white-space: nowrap; }
.item .medal svg { width: 24px; height: 24px; }
.item .medal { width: 46px; height: 46px; flex: none; border-radius: 50%; background: rgba(137,215,173,.16); border: 2px solid rgba(137,215,173,.5);
  display: grid; place-items: center; font: 700 22px Plex; color: var(--mint); }

/* ===== المقدمة ===== */
.ichip { position: absolute; display: flex; align-items: center; gap: 14px; padding: 14px 20px; border-radius: 14px;
  background: rgba(255,255,255,.055); border: 1px solid rgba(255,255,255,.13); color: rgba(255,255,255,.82); font: 500 23px Plex;
  box-shadow: 0 14px 30px -18px rgba(0,0,0,.6); white-space: nowrap; }
.ichip .ii { width: 36px; height: 36px; border-radius: 9px; border: 1px solid rgba(137,215,173,.35); background: rgba(62,99,80,.6);
  display: grid; place-items: center; color: var(--mint); }
.ichip .ii svg { width: 19px; height: 19px; }
.ihead { position: absolute; left: 0; right: 0; text-align: center; }
.ilead { top: 330px; font: 600 66px Plex; }
.ititle { top: 448px; font: 700 112px/1 Plex; }
.ititle span { display: inline-block; margin: 0 .12em; }
.isub { top: 610px; font: 700 112px/1 Plex; color: var(--mint); }
.iline { position: absolute; top: 756px; height: 9px; border-radius: 9px; background: #E2B457; }
#endframe { position: absolute; inset: 0; opacity: 0; z-index: 8; }
#endframe img { width: 100%; height: 100%; display: block; }
#wash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; z-index: 9; }
</style>
</head>
<body>
<div id="bg"><div class="shape"></div><div class="lines"></div></div>
<header data-keep>
  <div class="brand"><img src="../../src/assets/icon-white.png" alt=""><div><b>بوابة مكة الثانوية الرقمية</b><small>مدرسة مكة الثانوية · مكة المكرمة</small></div></div>
  <div class="site">makkahsec.com</div>
</header>
<div class="stage" id="stage"></div>
<div id="wash"></div>

<script>
const Q = new URLSearchParams(location.search);
const SCENE = Q.get("s") || "usage";
const CK = '<svg viewBox="0 0 24 24" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
const ICON = {
  folder: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg>',
  send: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4z"/></svg>',
  inbox: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.5 5h13L22 12v6a2 2 0 01-2 2H4a2 2 0 01-2-2v-6z"/></svg>',
  shield: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>',
  sign: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17c3-4 5-8 7-8s-1 8 2 8 3-5 5-5 1 4 4 4"/><path d="M3 21h18"/></svg>',
  medal: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="15" r="6"/><path d="M8.5 10L6 2h4l2 4 2-4h4l-2.5 8"/></svg>',
  star: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 2l3 6.5 7 .8-5.2 4.8 1.5 7L12 17.5 5.7 21l1.5-7L2 9.3l7-.8z"/></svg>',
  flag: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 22V3"/><path d="M4 4h13l-2.5 4.5L17 13H4"/></svg>',
  ball: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M3.5 9.5c5 1 12 1 17 0M3.5 14.5c5-1 12-1 17 0M12 3c-3 5-3 13 0 18"/></svg>',
  pen: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg>',
  cal: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
  doc: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2h9l5 5v15H6z"/><path d="M14 2v6h6M9 13h7M9 17h5"/></svg>',
  clock: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  bell: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 16V11a6 6 0 0112 0v5l2 2H4z"/><path d="M10 21h4"/></svg>',
  note: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>',
  check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M8 12l3 3 5-6"/></svg>',
  pflag: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 21V4h11l-2 4 2 4H6"/></svg>',
  users: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0113 0"/><path d="M16 4.5a3.5 3.5 0 010 7M18 14a6 6 0 013.5 6"/></svg>',
  user: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0116 0"/></svg>',
};

/* أطوال مقاطع الصوت (ثوانٍ) — تقديرية حتى تصل التسجيلات */
const DEF = { intro: [], usage: [8.5], new: [3.6, 6.2, 9.6, 6.4, 6.4, 8.8], ach: [2.6, 9.4, 6.4, 6.0, 6.8] };
const D = (Q.get("d") && SCENE !== "intro" ? Q.get("d").split(",").map(Number) : DEF[SCENE]);
const LEAD = 0.7, GAP = 0.55, TAIL = 1.1;
const starts = []; { let t = LEAD; for (const d of D) { starts.push(t); t += d + GAP; } }
const TOTAL = SCENE === "intro" ? 7.6 : starts.at(-1) + D.at(-1) + TAIL;
window.TOTAL = TOTAL;

const S = document.getElementById("stage");
const fmt = (n) => n.toLocaleString("en-US");

/* ------------------------------ المشاهد ------------------------------ */
if (SCENE === "intro") {
  document.querySelector("header").style.display = "none";
  // البطاقات بمواضعها في الفيديو الأول (المركز، زمن الظهور، ميل خفيف)
  const chips = [
    ["سجلات الحضور", "pen", 385, 275, 0.9, -2], ["نماذج ورقية", "doc", 1480, 265, 1.3, 2], ["رسائل الأسرة", "bell", 328, 805, 1.7, -1.5],
    ["الغياب والإنذارات", "pflag", 1510, 832, 1.9, 1.5], ["الجداول", "cal", 845, 213, 2.3, 1], ["الشهادات", "star", 535, 580, 2.5, -1],
    ["الاختبارات", "check", 1323, 582, 2.9, 1.5], ["الإحالات", "users", 935, 897, 3.1, 2], ["المناوبة والإشراف", "clock", 300, 512, 3.4, -2.5],
    ["التعاميم", "note", 1615, 500, 3.8, 2.5],
  ];
  S.innerHTML = chips.map(([t, ic, x, y, t0, r], i) =>
      `<div class="ichip" data-in="${t0}" data-a="chip" data-r="${r}" data-dx="${(i % 2 ? 1 : -1) * 14}" data-dy="${(i % 3 - 1) * 10}"

/* ------------------------------ المحرّك ------------------------------ */
// «@k±x» = بداية المقطع الصوتي k (يبدأ العد من 1 بعد المقطع 0 في new/ach) ± ثوانٍ
const base = SCENE === "usage" ? 0 : 0;
const at = (v) => {
  if (v == null || v === "") return null;
  if (!String(v).startsWith("@")) return Number(v);
  const m = String(v).match(/^@(\d+)([+-][\d.]+)?$/);
  return starts[Number(m[1])] + Number(m[2] || 0);
};
const ease = (x) => 1 - Math.pow(1 - Math.min(Math.max(x, 0), 1), 3);
const els = [...document.querySelectorAll("[data-in]")].map((el) => ({ el, a: el.dataset.a || "fade", tin: at(el.dataset.in), tout: at(el.dataset.out) }));
const counts = [...document.querySelectorAll("[data-count]")].map((el) => ({ el, v: +el.dataset.count, t0: +el.dataset.c0 }));
const hls = [...document.querySelectorAll("[data-hl]")];

function measure(el) { const r = document.createRange(); r.selectNodeContents(el); return r.getBoundingClientRect().width; }
window.render = (t) => {
  for (const { el, a, tin, tout } of els) {
    const p = ease((t - tin) / 0.6);
    let o = Math.min(Math.max((t - tin) / 0.45, 0), 1);
    let tf = "";
    if (a === "up") tf = `translateY(${(1 - p) * 34}px)`;
    if (a === "right") tf = `translateX(${(1 - p) * -40}px)`;
    if (a === "pop") tf = `scale(${0.85 + 0.15 * p})`;
    if (a === "chip") {
      const k = Math.max(t - tin, 0);
      tf = `translate(-50%,-50%) translate(${el.dataset.dx * k / 7}px, ${el.dataset.dy * k / 7 + (1 - p) * 26}px) rotate(${el.dataset.r}deg) scale(${0.94 + 0.06 * p})`;
    }
    if (a === "lead") {   // يظهر أبيض ثم يخفت ويصعد قليلًا حين يأتي السؤال
      const q = ease((t - 4.3) / 0.6);
      tf = `translateY(${(1 - p) * 20 - q * 0}px)`;
      el.style.color = `rgba(255,255,255,${0.92 - 0.47 * q})`;
      el.style.fontSize = `${66 - 4 * q}px`;
    }
    if (a === "blur") { tf = `translateY(${(1 - p) * 14}px)`; el.style.filter = `blur(${(1 - p) * 14}px)`; }
    if (a === "draw") {   // خط تحت «في مكان واحد؟» يُرسم من اليمين
      const sub = document.querySelector(".isub"), w = sub.dataset.w || (sub.dataset.w = measure(sub));
      const q = ease((t - tin) / 0.7);
      el.style.width = `${w * q}px`; el.style.right = `${(1920 - w) / 2}px`; o = t >= tin ? 1 : 0;
    }
    if (a === "slide") tf = `translateY(${(1 - p) * 50}px) scale(${0.96 + 0.04 * p})`;
    if (el.dataset.kb && t > tin) tf += ` scale(${1 + Math.min(t - tin, 12) * 0.006})`;
    if (tout != null && t > tout) { const q = Math.min((t - tout) / 0.35, 1); o *= 1 - q; tf += ` translateY(${-q * 30}px)`; }
    // خروج المشهد كله في آخره
    const e = Math.min(Math.max((t - (TOTAL - 0.55)) / 0.45, 0), 1);
    if (!el.closest("[data-keep]")) o *= 1 - e;
    el.style.opacity = o; el.style.transform = tf;
  }
  const ef = document.getElementById("endframe");
  if (ef) ef.style.opacity = Math.min(Math.max((t - 6.95) / 0.6, 0), 1);
  for (const { el, v, t0 } of counts) {
    const p = ease((t - t0) / 1.6);
    el.textContent = fmt(Math.round(v * p));
  }
  // إبراز البند الذي يتكلم عنه الصوت
  for (const el of hls) {
    const k = +el.dataset.hl, s0 = starts[k], s1 = starts[k + 1] ?? TOTAL;
    const on = t >= s0 - 0.2 && t < s1 - 0.2;
    const any = t >= starts[1] - 0.2;
    if (t >= at(el.dataset.in)) el.style.opacity = String(Math.min(+el.style.opacity, on || !any ? 1 : 0.42));
    el.querySelector("b").style.color = on ? "var(--mint)" : "#fff";
  }
};
window.render(0);
</script>
