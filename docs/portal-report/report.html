<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>تقرير بوابة مكة الثانوية الرقمية</title>
<!-- تقرير البوابة للجنة التقويم والاعتماد المدرسي، على طقم التقارير المصمّمة نفسه
     (src/components/report/report.css) وأوراق استوديو البوابة (src/pages/studio/studio.css).
     النسخة: ?theme=light (الملوّنة، الافتراضية) أو ?theme=official (الرسمية بترويسة الوزارة).
     يُطبع PDF بـ build.mjs، والأرقام من supabase/reports/report_*.sql ومن الكود نفسه. -->
<link rel="stylesheet" href="../../src/pages/studio/studio.css">
<link rel="stylesheet" href="../../src/components/report/report.css">
<style>
@font-face{font-family:'IBM Plex Sans Arabic';font-weight:400;src:url(../../public/fonts/ibm-plex-sans-arabic-400-arabic.woff2);unicode-range:U+0600-06FF,U+0750-077F,U+08A0-08FF,U+FB50-FDFF,U+FE70-FEFF,U+200C-200E}
@font-face{font-family:'IBM Plex Sans Arabic';font-weight:500;src:url(../../public/fonts/ibm-plex-sans-arabic-500-arabic.woff2);unicode-range:U+0600-06FF,U+0750-077F,U+08A0-08FF,U+FB50-FDFF,U+FE70-FEFF,U+200C-200E}
@font-face{font-family:'IBM Plex Sans Arabic';font-weight:600;src:url(../../public/fonts/ibm-plex-sans-arabic-600-arabic.woff2);unicode-range:U+0600-06FF,U+0750-077F,U+08A0-08FF,U+FB50-FDFF,U+FE70-FEFF,U+200C-200E}
@font-face{font-family:'IBM Plex Sans Arabic';font-weight:700;src:url(../../public/fonts/ibm-plex-sans-arabic-700-arabic.woff2);unicode-range:U+0600-06FF,U+0750-077F,U+08A0-08FF,U+FB50-FDFF,U+FE70-FEFF,U+200C-200E}
@font-face{font-family:'IBM Plex Sans Arabic';font-weight:400;src:url(../../public/fonts/ibm-plex-sans-arabic-400-latin.woff2);unicode-range:U+0000-00FF,U+2000-206F,U+2212}
@font-face{font-family:'IBM Plex Sans Arabic';font-weight:500;src:url(../../public/fonts/ibm-plex-sans-arabic-500-latin.woff2);unicode-range:U+0000-00FF,U+2000-206F,U+2212}
@font-face{font-family:'IBM Plex Sans Arabic';font-weight:600;src:url(../../public/fonts/ibm-plex-sans-arabic-600-latin.woff2);unicode-range:U+0000-00FF,U+2000-206F,U+2212}
@font-face{font-family:'IBM Plex Sans Arabic';font-weight:700;src:url(../../public/fonts/ibm-plex-sans-arabic-700-latin.woff2);unicode-range:U+0000-00FF,U+2000-206F,U+2212}
@page{size:A4 portrait;margin:0}
html,body{margin:0;background:#9aa59f}
.sheet{margin:0 auto 14px;break-after:page}
@media print{html,body{background:#fff}.sheet{margin:0}}
/* الأرقام لاتينية ومن اليسار لليمين كما في دليل الهوية (.num في src/index.css) */
.stu .num{direction:ltr;unicode-bidi:isolate;display:inline-block;font-variant-numeric:tabular-nums}
.mr svg{fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.mr-body p.lead{font-size:13px;line-height:1.8;color:var(--mr-ink2)}
.mr-box p{font-size:12px;line-height:1.75;color:var(--mr-ink2)}
.mr-box p b{color:var(--mr-ink)}
.mr-box ul.dl{list-style:none;display:grid;gap:4px}
.mr-box ul.dl li{position:relative;padding-right:15px;font-size:12px;line-height:1.7;color:var(--mr-ink2)}
.mr-box ul.dl li b{color:var(--mr-ink)}
.mr-box ul.dl li::before{content:"";position:absolute;right:0;top:8px;width:7px;height:7px;border-radius:2px;background:var(--mr-mint);transform:rotate(45deg)}
.mr-kpi .s{white-space:normal}
.mr-kpi .v{font-size:30px}
.new{display:inline-block;margin-right:6px;border-radius:999px;padding:0 8px;font-size:10px;font-weight:700;line-height:18px;background:var(--mr-tint);color:var(--mr-deep);border:1px solid var(--mr-mint);vertical-align:middle}
.stu-official .new{background:#fff;color:#9A7B22;border-color:#B8912F88}
.shot{border:1.3px solid var(--mr-line);border-radius:12px;overflow:hidden;background:#fff}
.stu-official .shot{border-radius:6px}
.shot img{display:block;width:100%}
.shot.crop img{object-fit:cover;object-position:top}
.cap{font-size:11px;color:var(--mr-ink2);text-align:center;margin-top:4px}
.phone{border:7px solid #1C3328;border-radius:24px;overflow:hidden;background:#fff}
.phone img{display:block;width:100%}
.flow{display:flex;gap:5px;align-items:stretch}
.flow div{flex:1;border:1.3px solid var(--mr-line);background:#F6FBF8;border-radius:11px;padding:7px 4px;text-align:center}
.stu-official .flow div{background:#fff;border-radius:6px}
.flow i{display:inline-flex;width:22px;height:22px;border-radius:50%;background:var(--mr-deep);color:#fff;font-style:normal;font-weight:700;font-size:11.5px;align-items:center;justify-content:center}
.flow b{display:block;font-size:12px;margin-top:3px;line-height:1.35}
.flow small{display:block;font-size:10.5px;color:var(--mr-ink2);line-height:1.4}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chips span{background:var(--mr-tint);border-radius:999px;padding:2px 11px;font-size:11.5px;font-weight:600;color:var(--mr-deep)}
.stu-official .chips span{background:#fff;border:1px solid var(--mr-line)}
.toc div{padding:8px 4px!important;font-size:13.5px!important}
.toc .no{color:var(--mr-deep);font-weight:700;width:30px}
.mr-table td.code{font-weight:700;white-space:nowrap}
.mr-table td.plus{color:var(--mr-acc);font-weight:600}
.mr-table tr.grp td{background:var(--mr-tint)!important;color:var(--mr-deep);font-weight:700}
.stu-official .mr-table tr.grp td{background:#F6FBF8!important}
.mr-table{font-size:11px}
.mr-table td{line-height:1.45;padding:4px 7px}
.mr-sec .no svg{width:24px;height:24px}
.road{display:grid;gap:8px}
.road .mr-box{border-right:4px solid var(--mr-mint)}
.road small{display:block;font-size:11px;font-weight:700;color:var(--mr-acc)}
</style>
</head>
<body>
<div id="doc">

<!-- ======================= الغلاف ======================= -->
<template data-cover>
  <div class="hero">
    <div><span class="stu-tag">{shield}مقدَّم إلى لجنة التقويم والاعتماد المدرسي</span></div>
    <h1 class="stu-h1" style="font-size:72px">تقرير البوابة</h1>
    <span class="stu-sub" style="font-size:34px">بوابة مكة الثانوية الرقمية</span>
    <div class="stu-grule"></div>
    <div class="month">
      <div class="m"><b>الإصدار الثاني</b><span>محدَّث بأرقام التشغيل الفعلي</span></div>
      <div class="hj"><b class="num">17/10/2026</b><span class="num">06/05/1448</span></div>
    </div>
    <div class="stu-info">
      <div class="stu-row"><div class="stu-ic">{pen}</div><div class="k">مبادرة مقدّمة من</div><div class="v" style="font-size:19px">محمد بن حسن بن حسين الحازمي<small>محضر معمل الحاسب الآلي</small></div></div>
      <div class="stu-row"><div class="stu-ic">{home}</div><div class="k">الجهة</div><div class="v" style="font-size:19px">مدرسة مكة الثانوية · مكة المكرمة</div></div>
      <div class="stu-row"><div class="stu-ic">{cal}</div><div class="k">فترة البيانات</div><div class="v" style="font-size:19px"><span class="num">14/09 - 17/10/2026</span><small>22 يوم دراسة فعلية</small></div></div>
    </div>
    <div class="conf">{chart}منظومة رقمية متكاملة تخدم الإدارة والمعلمين والطلاب وأولياء الأمور، وتصنع لكل إجراء مدرسي شاهدًا موثقًا</div>
  </div>
  <div class="strip">
    <div><b class="num">548</b><span>حسابًا مفعّلًا</span></div>
    <div><b class="num">3,620</b><span>سجل حضور يوميًا</span></div>
    <div><b class="num">4,656</b><span>إشعارًا يصل يوميًا</span></div>
    <div><b class="num">132</b><span>إجراءً موثقًا</span></div>
  </div>
</template>

<!-- ======================= المحتويات ======================= -->
<template data-page data-title="محتويات التقرير" data-sub="يعرض البوابة كما تعمل اليوم، وما تنتجه من شواهد لمؤشرات التقويم">
  <div class="mr-box"><div class="mr-list toc" id="toc"></div></div>
  <div class="mr-box tint"><p>كل الأرقام في هذا التقرير مستخرجة من البوابة نفسها: من قاعدة بياناتها في <span class="num">17/10/2026</span>، ومن دليل الاستخدام المدمج، ومن بنية النظام وصلاحياته. والشاشات المعروضة لقطات حقيقية من البوابة ببيانات توضيحية.</p></div>
</template>

<!-- ======================= 01 الملخص ======================= -->
<template data-page data-no="01" data-toc="الملخص التنفيذي" data-title="بوابة واحدة لكل ما تحتاجه المدرسة" data-sub="الملخص التنفيذي">
  <p class="lead">بوابة مكة الثانوية الرقمية منصة ويب داخلية بنتها المدرسة لمجتمعها، تجمع في مكان واحد الحضور والغياب، والجداول، والنماذج الرسمية، والاختبارات، والأحداث، والتطوير المهني وتقييم الأداء، والتواصل مع الأسرة. تعمل على الجوال والحاسب، ويحصل كل مستخدم فيها على واجهة تناسب دوره.</p>
  <div class="mr-high"><h3>{spark}البوابة مبادرة ذاتية</h3><ul><li>قدّمها محمد بن حسن بن حسين الحازمي، محضر معمل الحاسب الآلي، فصمّمها وطوّرها وأدارها لخدمة مجتمع المدرسة كله.</li></ul></div>
  <div class="mr-kpis" style="grid-template-columns:repeat(3,1fr)">
    <div class="mr-kpi"><div class="ic">{users}</div><div class="v num">4</div><div class="k">فئات مستفيدة</div><div class="s">الإدارة، والمعلمون، والطلاب، وأولياء الأمور</div></div>
    <div class="mr-kpi"><div class="ic">{key}</div><div class="v num">24</div><div class="k">دورًا إداريًا وتخصصيًا</div><div class="s">لكل دور واجهته وصلاحياته</div></div>
    <div class="mr-kpi"><div class="ic">{book}</div><div class="v num">132</div><div class="k">إجراءً موثقًا</div><div class="s">في دليل الاستخدام المدمج بالخطوات</div></div>
    <div class="mr-kpi"><div class="ic">{grid}</div><div class="v num">14</div><div class="k">قسمًا خدميًا</div><div class="s">من الحضور إلى الاختبارات والأحداث</div></div>
    <div class="mr-kpi"><div class="ic">{palette}</div><div class="v num">21</div><div class="k">قالبًا للهوية</div><div class="s">في استوديو البوابة للمطبوعات والعروض</div></div>
    <div class="mr-kpi"><div class="ic">{shield}</div><div class="v num">292</div><div class="k">سياسة حماية</div><div class="s">على مستوى كل سجل في 110 جداول</div></div>
    <div class="mr-kpi"><div class="ic">{clock}</div><div class="v num">11</div><div class="k">خدمة آلية</div><div class="s">تذكير واعتماد وملخص وبصمة وروابط مؤقتة</div></div>
    <div class="mr-kpi"><div class="ic">{phone}</div><div class="v num">119</div><div class="k">شاشة</div><div class="s">تعمل على الجوال والحاسب</div></div>
    <div class="mr-kpi"><div class="ic">{flask}</div><div class="v num">+490</div><div class="k">تحديثًا منشورًا</div><div class="s">تطوير مستمر بنسخة تجريبية قبل كل نشر</div></div>
  </div>
  <div class="mr-row c2">
    <div class="mr-box tint"><h3>{check}ما الذي تغيّر في المدرسة</h3><p>صار تحضير الحصة من جوال المعلم، والغياب الرسمي يُعتمد آليًا، والنماذج والشهادات تصدر موقعة إلكترونيًا، والتطوير المهني يوثَّق ويصل شاهدًا لملف المعلم، وولي الأمر يعرف حضور ابنه في يومه.</p></div>
    <div class="mr-box tint"><h3>{shield}لماذا يهم ذلك للتقويم</h3><p>كل إجراء في البوابة يترك سجلًا مؤرخًا ومنسوبًا لصاحبه، فتتحول الممارسة اليومية إلى شواهد جاهزة تُستخرج تقارير مطبوعة أو ملفات Excel.</p></div>
  </div>
</template>

<!-- ======================= 01 الأرقام ======================= -->
<template data-page data-no="01" data-title="البوابة بالأرقام" data-sub="الاستخدام الفعلي من 14/09 إلى 17/10/2026، محسوبًا يوميًا على 22 يوم دراسة فعلية">
  <div class="mr-high"><h3>{spark}في كل يوم دراسي</h3><ul><li>نحو 3,600 سجل حضور يرصدها المعلمون حصةً بحصة، و4,600 إشعار يصل إلى المعلمين والطلاب وأولياء الأمور، و382 طالبًا يبصمون عند الدخول.</li></ul></div>
  <div class="mr-kpis" style="grid-template-columns:repeat(3,1fr)">
    <div class="mr-kpi"><div class="ic">{check}</div><div class="v num">3,620</div><div class="k">سجل حضور يوميًا</div><div class="s">حصةً بحصة · <span class="num">79,635</span> إجمالًا</div></div>
    <div class="mr-kpi"><div class="ic">{phone}</div><div class="v num">117</div><div class="k">حصة تُحضَّر يوميًا</div><div class="s">من جوال المعلم · <span class="num">2,573</span> إجمالًا</div></div>
    <div class="mr-kpi"><div class="ic">{bell}</div><div class="v num">4,656</div><div class="k">إشعارًا يصل يوميًا</div><div class="s">للمعلمين والطلاب والأسر · <span class="num">102,432</span> إجمالًا</div></div>
    <div class="mr-kpi"><div class="ic">{send}</div><div class="v num">1,415</div><div class="k">إشعارًا يُرسل يوميًا</div><div class="s">من الإدارة والمعلمين والخدمات · <span class="num">31,135</span> إجمالًا</div></div>
    <div class="mr-kpi"><div class="ic">{finger}</div><div class="v num">382</div><div class="k">طالبًا يبصمون يوميًا</div><div class="s">منذ التشغيل الكامل للأجهزة في <span class="num">11/10/2026</span> · الذروة <span class="num">508</span></div></div>
    <div class="mr-kpi"><div class="ic">{clip}</div><div class="v num">305</div><div class="k">خانة رصد يوميًا</div><div class="s">في سجل المتابعة الإلكتروني · <span class="num">6,709</span> إجمالًا</div></div>
    <div class="mr-kpi"><div class="ic">{quiz}</div><div class="v num">35</div><div class="k">ورقة اختبار تُرصد يوميًا</div><div class="s"><span class="num">773</span> ورقة من <span class="num">58</span> اختبارًا، منها <span class="num">10</span> إلكترونية</div></div>
    <div class="mr-kpi"><div class="ic">{cal}</div><div class="v num">21</div><div class="k">يوم غياب رسمي</div><div class="s">اعتُمد آليًا من <span class="num">22</span> يوم دراسة، دون تدخل يدوي</div></div>
    <div class="mr-kpi"><div class="ic">{users}</div><div class="v num">548</div><div class="k">حسابًا مفعّلًا</div><div class="s"><span class="num">55</span> معلمًا، و<span class="num">361</span> طالبًا، و<span class="num">120</span> ولي أمر</div></div>
    <div class="mr-kpi"><div class="ic">{doc}</div><div class="v num">193</div><div class="k">نموذجًا رسميًا</div><div class="s">صدر إلكترونيًا بالتوقيع والختم</div></div>
    <div class="mr-kpi"><div class="ic">{send}</div><div class="v num">49</div><div class="k">إحالة طالب</div><div class="s">أُغلق منها <span class="num">44</span> بمسار موثّق حتى إقرار ولي الأمر</div></div>
    <div class="mr-kpi"><div class="ic">{award}</div><div class="v num">135</div><div class="k">شاهد أداء وظيفي</div><div class="s">رفعه المعلمون، عدا الشواهد الآلية</div></div>
  </div>
  <div class="mr-row c2">
    <div class="mr-box tint"><h3>{users}مشاركة الأسرة رقميًا</h3><p>شارك 77 طالبًا في الفعاليات، ووصلت 57 موافقة إلكترونية من أولياء أمورهم إلى حساباتهم، وصدرت 54 شهادة مشاركة دون ورقة واحدة.</p></div>
    <div class="mr-box tint"><h3>{bell}وصول فوري</h3><p>فعّل 118 جهازًا إشعارات الجوال، فتصل رسائل المدرسة إلى الشاشة الرئيسية لحظة صدورها.</p></div>
  </div>
  <p class="mr-note">المصدر: قاعدة بيانات البوابة في <span class="num">17/10/2026</span>. المعدل اليومي = الإجمالي ÷ 22 يوم دراسة فعلية (أيام الأحد إلى الخميس التي فيها تحضير، دون الإجازات)، والبصمة على أيام تشغيل الأجهزة الكامل من 11 إلى <span class="num">15/10/2026</span>.</p>
</template>

<!-- ======================= الجديد ======================= -->
<template data-page data-no="★" data-toc="جديد هذا الإصدار" data-title="ما أُضيف منذ الإصدار الأول" data-sub="أكثر من 150 تحديثًا نُشرت بعد 04/10/2026، منها هذه الخدمات الجديدة">
  <div class="mr-row c2">
    <div class="mr-box"><h3>{id}ملف المعلم الرقمي</h3><p>تقرير تفاعلي عن أعمال المعلم يُبنى من بيانات البوابة، ويُعرض برمز QR ورابط ثابت على المشرف أو اللجنة، مع سجل للزوار وملاحظاتهم.</p></div>
    <div class="mr-box"><h3>{award}تقييم الأداء الوظيفي وشواهده</h3><p>المعلم يرفع شواهده لكل بند، وتصل إليه شواهد آلية من عمله في البوابة، ويقيّمه المدير بمرحلتيه.</p></div>
    <div class="mr-box"><h3>{book}التطوير المهني</h3><p>ثمانية نماذج لسجل التطوير المهني، وتقارير جلسات مجتمع التعلم المهني، وتبادل الزيارات بين معلمي القسم، وملف تطوير لكل قسم.</p></div>
    <div class="mr-box"><h3>{target}خطط التطوير (حلقة التحسين)</h3><p>توصية، فخطة، فمتابعة بموعد، فأثر يُقاس آليًا من الزيارة أو التقييم التالي، مع لوحة للمدير.</p></div>
    <div class="mr-box"><h3>{heart}التوجيه الطلابي والإنذار المبكر</h3><p>قائمة آلية بمن يحتاج تدخلًا، وحالات سرية بجلساتها، وطلبات المقابلة، واستمارة توضيح المستوى، وتقرير شهري للموجه.</p></div>
    <div class="mr-box"><h3>{send}إحالة الطالب: سلسلة من ست حلقات</h3><p>من معالجة المعلم إلى إقرار ولي الأمر، لا تُفتح حلقة قبل اكتمال التي قبلها، وكل خطوة موثّقة باسم صاحبها وتاريخها.</p></div>
    <div class="mr-box"><h3>{quiz}دورة الاختبار والتصحيح الجماعي</h3><p>تشخيصي واختبارا فترتين بمراحل حتى الإغلاق، وخطط علاجية واختبار تحقق يقيس الأثر، وتصحيح بطاقات الفصل كله دفعة واحدة.</p></div>
    <div class="mr-box"><h3>{clip}متابعة رصد درجات نور</h3><p>كشف من الجدول الدراسي بكل مادة وفصل ومعلم، ونسبة الرصد لكل فترة، ومهلة ملونة منذ موعد الاختبار.</p></div>

  swap:'<path d="m16 3 4 4-4 4M20 7H4M8 21l-4-4 4-4M4 17h16"/>',
  key:'<circle cx="7.5" cy="15.5" r="5.5"/><path d="m21 2-9.6 9.6M15.5 7.5l3 3L22 7l-3-3"/>',
  buoy:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/><path d="m5.6 5.6 3.6 3.6M14.8 14.8l3.6 3.6M14.8 9.2l3.6-3.6M5.6 18.4l3.6-3.6"/>',
  flask:'<path d="M9 2h6M10 2v7L4 20a1 1 0 0 0 .9 1.5h14.2A1 1 0 0 0 20 20L14 9V2"/><path d="M7 15h10"/>',
  link:'<path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/>',
  grid:'<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',
  phone:'<rect x="6" y="2" width="12" height="20" rx="2.5"/><path d="M11 18h2"/>',
  spark:'<path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5L18 18M6 18l2.5-2.5M15.5 8.5L18 6"/>',
  list:'<path d="M9 6h12M9 12h12M9 18h12"/><circle cx="4.5" cy="6" r="1"/><circle cx="4.5" cy="12" r="1"/><circle cx="4.5" cy="18" r="1"/>'
};
const svg = (k) => `<svg viewBox="0 0 24 24">${I[k] || ""}</svg>`;
const fill = (h) => h.replace(/\{(\w+)\}/g, (m, k) => (I[k] ? svg(k) : m));

const theme = new URLSearchParams(location.search).get("theme") === "official" ? "official" : "light";
const ICON = "../../src/assets/icon-mint.png", MOE = "../../src/assets/moe-logo.png";
const GOV = "المملكة العربية السعودية<br>وزارة التعليم<br>الإدارة العامة للتعليم بمنطقة مكة المكرمة<b>مدرسة مكة الثانوية</b>";
const TITLE = "تقرير بوابة مكة الثانوية الرقمية";
const FOOT = "تقرير لجنة التقويم والاعتماد المدرسي";

const tpls = [...document.querySelectorAll("template")];
const total = tpls.length;
const out = tpls.map((t, i) => {
  const body = fill(t.innerHTML);
  if (t.hasAttribute("data-cover")) {
    const head = theme === "official"
      ? `<div class="stu-gov"><div class="lines">${GOV}</div><div class="logos"><img src="${MOE}"><img src="${ICON}"></div></div><div class="stu-rule"></div>`
      : `<div class="stu-bar"><div class="stu-brand"><img src="${ICON}"><div><b>بوابة مكة الثانوية الرقمية</b><span>مدرسة مكة الثانوية</span></div></div><div class="stu-year num">1448 - 1449</div></div>`;
    return `<div class="stu stu-cover stu-portrait stu-${theme} mr mr-cover sheet"><div class="stu-bgbox"><div class="stu-tex"></div><div class="stu-blob"></div><div class="stu-cube a"></div><div class="stu-cube b"></div><div class="stu-progress"></div></div>
      <div class="stu-page">${head}${body}<div class="stu-foot"><span>بوابة مكة الثانوية الرقمية · ${FOOT}</span><span class="site">makkahsec.com</span></div></div></div>`;
  }
  const d = t.dataset;
  const head = theme === "official"
    ? `<div class="mr-gov"><div class="lines">${GOV}</div><div class="ttl"><b>${TITLE}</b><span>الإصدار الثاني · <span class="num">17/10/2026</span></span></div><div class="logos"><img src="${MOE}"><img src="${ICON}"></div></div><div class="mr-rule"></div>`
    : `<div class="mr-head"><div class="brand"><img src="${ICON}"><div><b>${TITLE}</b><span>بوابة مكة الثانوية الرقمية · مدرسة مكة الثانوية</span></div></div><div class="meta"><span class="mr-pill">الإصدار الثاني</span><span class="mr-pill solid num">17/10/2026</span></div></div>`;
  const no = d.no ? `<small>القسم</small><b class="num">${d.no}</b>` : svg("list");
  const sec = `<div class="mr-sec"><div class="no">${no}</div><div><h2>${d.title}</h2>${d.sub ? `<p>${d.sub}</p>` : ""}</div><div class="grule"></div></div>`;
  return `<div class="stu stu-portrait stu-${theme} mr sheet" data-toc="${d.toc || ""}" data-no="${d.no || ""}"><div class="mr-frame"></div><div class="mr-page">${head}${sec}<div class="mr-body">${body}</div>
    <div class="mr-foot"><span>بوابة مكة الثانوية الرقمية · ${FOOT}</span><span class="pg">صفحة <span class="num">${i + 1}</span> من <span class="num">${total}</span></span><span class="site">makkahsec.com</span></div></div></div>`;
});
document.getElementById("doc").innerHTML = out.join("");

// المحتويات
const sheets = [...document.querySelectorAll(".sheet")];
document.getElementById("toc").innerHTML = sheets.filter((s) => s.dataset.toc)
  .map((s) => `<div><span><span class="no num">${s.dataset.no}</span> ${s.dataset.toc}</span><span class="num">${sheets.indexOf(s) + 1}</span></div>`).join("");

// أقسام دليل الاستخدام وعدد إجراءاتها (src/pages/Help.jsx)
const BARS = [["شؤون الطلاب",20],["استوديو البوابة",18],["النماذج والشهادات",16],["المعلم",12],["الطالب وولي الأمر",11],["الاختبارات القصيرة",10],["الدخول والحساب",9],["الأحداث والمناسبات",9],["الشؤون التعليمية",8],["المحتوى والإشعارات",6],["الدعم الفني",6],["الحسابات والصلاحيات",5],["النتائج",1],["التوجيه الطلابي",1]];
document.getElementById("bars").innerHTML = BARS.map(([t, v]) =>
  `<div class="mr-bar wide"><span class="t">${t}</span><span class="tr"><i style="width:${(v / 20) * 100}%"></i></span><span class="n num">${v}</span></div>`).join("");
</script>
</body>
