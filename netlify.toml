[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# مسارات أجهزة البصمة (ZKTeco ADMS) — يجب أن تسبق قاعدة SPA
[[redirects]]
  from = "/iclock/*"
  to = "/.netlify/functions/iclock"
  status = 200
  force = true

# ضروري لتطبيق صفحة واحدة: أي مسار يعود إلى index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
