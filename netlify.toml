[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# ===================== الدوال المجدولة =====================
# المواعيد بتوقيت UTC، والسعودية تسبقه بثلاث ساعات.
# أيام الأسبوع: 0 = الأحد … 4 = الخميس

# اللقطة اليومية لملخّص حالة الموقع — 11:55 مساءً بتوقيت السعودية
[functions."site-status-snapshot"]
  schedule = "55 20 * * *"

# تذكير المعلمين برصد التحضير — كل ٥ دقائق خلال الدوام، الأحد إلى الخميس
# 4-11 UTC = 7 صباحًا حتى 2 ظهرًا بتوقيت السعودية
[functions."attendance-reminder"]
  schedule = "*/5 4-11 * * 0-4"

# ملخّص تحضير اليوم للإدارة — 2:20 ظهرًا بتوقيت السعودية
[functions."attendance-daily-summary"]
  schedule = "20 11 * * 0-4"

# مسارات أجهزة البصمة (ZKTeco ADMS) — يجب أن تسبق قاعدة SPA
[[redirects]]
  from = "/iclock/*"
  to = "/.netlify/functions/iclock"
  status = 200
  force = true

# ضروري لتطبيق صفحة واحدة: أي مسار يعود إلى index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# index.html يجب أن يُجلب طازجًا دائمًا — وإلا أشار لملفات JS بمُعرّفات
# قديمة اختفت بعد النشر الجديد فتظهر شاشة بيضاء حتى التحديث اليدوي.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

# ملفات الأصول تحمل مُعرّف hash فريدًا لكل بناء، فيمكن تخزينها للأبد بأمان
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
