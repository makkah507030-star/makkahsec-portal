# نسخة احتياطية أسبوعية مشفّرة خارج Supabase: قاعدة البيانات (مخطط public
# وحسابات الدخول وسياسات الملفات) والملفات المرفوعة. تُحفظ 90 يومًا في Actions ← Backup.
# خطوات الإعداد والاسترجاع: docs/backup.md
name: Backup

on:
  schedule:
    - cron: "0 22 * * 4" # الجمعة 1:00 فجرًا بتوقيت السعودية
  workflow_dispatch:

concurrency:
  group: backup
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backup:
    name: النسخ الاحتياطي
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
    steps:
      - name: التحقق من الأسرار
        run: |
          missing=""
          for v in SUPABASE_DB_URL SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY BACKUP_PASSPHRASE; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::أسرار ناقصة في Settings ← Secrets and variables ← Actions:$missing"
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: تثبيت المكتبات
        run: npm ci

      - name: تثبيت pg_dump
        run: |
          sudo apt-get install -y -qq postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -qq postgresql-client-17

      - name: نسخ قاعدة البيانات
        run: |
          mkdir -p backup/db
          PG=/usr/lib/postgresql/17/bin
          $PG/pg_dump "$SUPABASE_DB_URL" -Fc --schema=public -f backup/db/public.dump
          $PG/pg_dump "$SUPABASE_DB_URL" -Fc --data-only \
            --table=auth.users --table=auth.identities -f backup/db/auth.dump
          # سياسات صلاحيات الملفات: خارج مخطط public فلا تشملها النسخة أعلاه
          $PG/psql "$SUPABASE_DB_URL" -At -v ON_ERROR_STOP=1 \
            -f scripts/storage-policies.sql > backup/db/storage_policies.sql
          # تأكد أن النسخ مقروءة قبل تشفيرها
          $PG/pg_restore --list backup/db/public.dump > /dev/null
          $PG/pg_restore --list backup/db/auth.dump > /dev/null
          ls -lh backup/db

      - name: نسخ الملفات المرفوعة
        run: node scripts/backup-storage.mjs backup/storage

      - name: الضغط والتشفير
        id: pack
        run: |
          name="makkahsec-backup-$(TZ=Asia/Riyadh date +%F)"
          tar -czf "$name.tar.gz" backup
          gpg --batch --yes --pinentry-mode loopback --symmetric --cipher-algo AES256 \
            --passphrase "$BACKUP_PASSPHRASE" -o "$name.tar.gz.gpg" "$name.tar.gz"
          rm -rf backup "$name.tar.gz"
          ls -lh "$name.tar.gz.gpg"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pack.outputs.name }}
          path: ${{ steps.pack.outputs.name }}.tar.gz.gpg
          retention-days: 90
          compression-level: 0
          if-no-files-found: error
