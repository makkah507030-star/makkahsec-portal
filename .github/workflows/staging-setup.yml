# إعداد النسخة التجريبية (makkahsec-staging): ينشئ بنية قاعدة البيانات التجريبية
# ويملؤها بمدرسة وهمية، ويضبط مفاتيح دوال Netlify للموقع التجريبي.
# يعمل تلقائيًا حين يتغيّر ملف SQL أو بيانات المدرسة الوهمية في فرع claude/...،
# فتبقى القاعدة التجريبية مطابقة لبنية الفرع، ويدويًا من Actions ← Run workflow.
# آمن لإعادة التشغيل. التفاصيل: docs/staging.md
name: إعداد النسخة التجريبية

on:
  push:
    branches: ["claude/**"]
    paths:
      - "supabase/**"
      - "scripts/staging-users.mjs"
      - ".github/workflows/staging-setup.yml"
  workflow_dispatch:

concurrency:
  group: staging-setup
  cancel-in-progress: false

permissions:
  contents: read

env:
  # قيم عامة غير سرية (تظهر أصلًا في كود الموقع التجريبي)
  STAGING_SUPABASE_URL: "https://dwkkxthgocemakkhfrbe.supabase.co"
  NETLIFY_SITE_ID: "6bbc8306-2d84-41fb-b091-e95d05a182bc"
  STAGING_SITE_URL: "https://makkahsec-staging.netlify.app"
  STAGING_PASSWORD: "Mk@Staging-1448"

jobs:
  setup:
    name: الإعداد
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      STAGING_DB_URL: ${{ secrets.STAGING_DB_URL }}
      STAGING_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SERVICE_ROLE_KEY }}
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      PROD_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
    steps:
      - name: التحقق من الأسرار
        run: |
          missing=""
          for v in STAGING_DB_URL STAGING_SERVICE_ROLE_KEY NETLIFY_AUTH_TOKEN; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::أسرار ناقصة في Settings ← Secrets and variables ← Actions:$missing"
            exit 1
          fi
          if [ "$STAGING_SUPABASE_URL" = "__PENDING__" ]; then
            echo "::error::رابط مشروع Supabase التجريبي لم يُضبط بعد في هذا الملف (STAGING_SUPABASE_URL)"
            exit 1
          fi

      # حارس: كل الخطوات التالية تكتب في قاعدة البيانات، فلا بد أن تكون التجريبية
      - name: التأكد أنها القاعدة التجريبية لا الحقيقية
        run: |
          ref=$(echo "$STAGING_SUPABASE_URL" | sed -E 's#https?://([a-z0-9]+)\..*#\1#')
          prod=$(echo "$PROD_SUPABASE_URL" | sed -E 's#https?://([a-z0-9]+)\..*#\1#')
          if [ -n "$prod" ] && [ "$ref" = "$prod" ]; then
            echo "::error::STAGING_SUPABASE_URL هو رابط القاعدة الحقيقية — توقّف الإعداد"; exit 1
          fi
          if ! echo "$STAGING_DB_URL" | grep -q "$ref"; then
            echo "::error::STAGING_DB_URL لا يخص المشروع التجريبي ($ref) — راجع السرّ"; exit 1
          fi
          if [ -n "$prod" ] && echo "$STAGING_DB_URL" | grep -q "$prod"; then
            echo "::error::STAGING_DB_URL يشير إلى القاعدة الحقيقية — توقّف الإعداد"; exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # تواريخ ملفات SQL تحدد ترتيب تنفيذها

      - name: تصحيح رابط قاعدة البيانات
        run: |
          url=$(SUPABASE_DB_URL="$STAGING_DB_URL" python3 scripts/normalize-db-url.py)
          echo "::add-mask::$url"
          echo "DB=$url" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: تثبيت المكتبات
        run: npm ci

      - name: تثبيت psql
        run: |
          sudo apt-get install -y -qq postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -qq postgresql-client-17
          # psql يتوقف عند أول خطأ، ويُظهر نص الخطأ في ملخص التشغيل
          cat > /tmp/q.sh <<'EOF'
          #!/usr/bin/env bash
          out=$(psql "$DB" -v ON_ERROR_STOP=1 -q "$@" 2>&1); s=$?
          [ -n "$out" ] && echo "$out"
          if [ "$s" -ne 0 ]; then
            echo "::error title=قاعدة البيانات::$(echo "$out" | tail -15 | sed ':a;N;$!ba;s/\n/%0A/g')"
          fi
          exit "$s"
          EOF
          chmod +x /tmp/q.sh

      # إشعارات الجوال من القاعدة التجريبية تذهب للموقع التجريبي، لا لـ makkahsec.com
      - name: تجهيز ملفات SQL
        run: |
          mkdir -p /tmp/sql
          schema_ts=$(git log -1 --format=%ct -- supabase/schema/schema.sql)
          sed "s#https://makkahsec.com/.netlify/functions#$STAGING_SITE_URL/.netlify/functions#g" \
            supabase/schema/schema.sql > /tmp/sql/schema.sql
          # ملفات SQL الأحدث من آخر تصدير للبنية، بترتيب إضافتها
          : > /tmp/sql/list.txt
          for f in supabase/*.sql; do
            if [ "$(basename "$f")" = export_schema.sql ]; then continue; fi
            ts=$(git log -1 --format=%ct -- "$f")
            if [ "$ts" -gt "$schema_ts" ]; then echo "$ts $f" >> /tmp/sql/list.txt; fi
          done
          sort -n /tmp/sql/list.txt | while read -r _ f; do
            sed "s#https://makkahsec.com/.netlify/functions#$STAGING_SITE_URL/.netlify/functions#g" \
              "$f" > "/tmp/sql/$(basename "$f")"
            echo "$(basename "$f")" >> /tmp/sql/order.txt
          done
          echo "ملفات بعد البنية:"; cat /tmp/sql/order.txt 2>/dev/null || echo "(لا شيء)"

      - name: بنية قاعدة البيانات (مرة واحدة)
        run: |
          exists=$(/tmp/q.sh -tAc "select to_regclass('public.users') is not null") || { echo "$exists"; exit 1; }
          if [ "$exists" = "t" ]; then
            echo "البنية موجودة مسبقًا — تُتخطّى."
          else
            # الإشعارات تُرسل عبر pg_net، وهي غير مفعّلة افتراضيًا في المشاريع الجديدة
            /tmp/q.sh -c "create extension if not exists pg_net;"
            /tmp/q.sh -f /tmp/sql/schema.sql
          fi

      - name: ملفات SQL الأحدث من البنية
        run: |
          [ -f /tmp/sql/order.txt ] || exit 0
          while read -r f; do
            echo "← $f"
            /tmp/q.sh -f "/tmp/sql/$f"
          done < /tmp/sql/order.txt

      - name: حاويات الملفات
        run: |
          node --input-type=module -e '
            import { createClient } from "@supabase/supabase-js";
            const c = createClient(process.env.STAGING_SUPABASE_URL, process.env.STAGING_SERVICE_ROLE_KEY,
                                   { auth: { persistSession: false } });
            const want = { guides: true, news: true, "notification-images": true, "ticket-attachments": true,
                           "event-reports": false, "form-assets": false, "quiz-images": false, results: false,
                           "reply-files": false };
            const { data, error } = await c.storage.listBuckets();
            if (error) { console.error(error.message); process.exit(1); }
            const have = new Set((data ?? []).map((b) => b.name));
            for (const [name, isPublic] of Object.entries(want)) {
              if (have.has(name)) { console.log("✓", name, "(موجودة)"); continue; }
              const { error: e } = await c.storage.createBucket(name, { public: isPublic });
              if (e) { console.error("✗", name, e.message); process.exit(1); }
              console.log("✓", name);
            }'

      - name: حسابات الدخول التجريبية
        run: node scripts/staging-users.mjs

      - name: بيانات المدرسة الوهمية
        run: /tmp/q.sh -f supabase/staging/seed.sql

      - name: مفاتيح دوال Netlify للموقع التجريبي
        run: |
          # --force: عند إعادة التشغيل المفتاح موجود، فبدونه تطلب الأداة تأكيدًا وتفشل
          set_env() {
            out=$(npx --yes netlify-cli@27.10.2 env:set "$@" --context production --scope functions --force 2>&1); s=$?
            echo "$out"
            if [ "$s" -ne 0 ]; then
              echo "::error title=مفاتيح Netlify::$(echo "$out" | tail -15 | sed 's/\x1b\[[0-9;]*m//g' | sed ':a;N;$!ba;s/\n/%0A/g')"
              exit "$s"
            fi
          }
          set_env SUPABASE_URL "$STAGING_SUPABASE_URL"
          set_env SUPABASE_SERVICE_ROLE_KEY "$STAGING_SERVICE_ROLE_KEY" --secret

      - name: النتيجة
        run: |
          {
            echo "## النسخة التجريبية جاهزة"
            echo "الرابط: $STAGING_SITE_URL"
            echo
            echo "| الحساب | رقم الهوية |"
            echo "|---|---|"
            echo "| الدعم الفني | 9000000001 |"
            echo "| مدير المدرسة | 9000000002 |"
            echo "| معلم الرياضيات | 9000000011 |"
            echo "| معلم اللغة العربية | 9000000012 |"
            echo "| طالب | 9000000101 |"
            echo "| ولي أمر | 9000000201 |"
            echo
            echo "كلمة المرور للجميع: موجودة في docs/staging.md"
          } >> "$GITHUB_STEP_SUMMARY"
