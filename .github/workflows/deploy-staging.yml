# نشر النسخة التجريبية (makkahsec-staging.netlify.app) من فروع العمل، قبل الدمج في main.
# يدويًا فقط عند الحاجة إلى تجربة: Actions ← نشر النسخة التجريبية ← Run workflow ← اختر الفرع.
# كان يُنشر مع كل دفع إلى فروع claude/...، وكل نشر يستهلك نحو 15 رصيدًا من رصيد Netlify
# المشترك مع الموقع الحقيقي، فأُوقف النشر التلقائي.
# موقوف مؤقتًا منذ 17 أكتوبر 2026 (الحارس أول خطوة أدناه)، والفروع القديمة كانت ما تزال تنشره
# تلقائيًا بنسختها القديمة، فعُطّل سير العمل أيضًا من Actions ← Disable workflow.
# الموقع الحقيقي لا يتأثر: له سير عمل Deploy الخاص به من main فقط. التفاصيل: docs/staging.md
name: نشر النسخة التجريبية

on:
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: النشر على الموقع التجريبي
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      # الموقع التجريبي — ليس سرًّا، ومختلف عن NETLIFY_SITE_ID للموقع الحقيقي
      NETLIFY_SITE_ID: "6bbc8306-2d84-41fb-b091-e95d05a182bc"
    steps:
      # لإعادة الموقع التجريبي: احذف هذه الخطوة، ثم Actions ← Enable workflow
      - name: الموقع التجريبي موقوف مؤقتًا
        run: |
          echo "::error::الموقع التجريبي موقوف مؤقتًا لتوفير رصيد Netlify. التفاصيل: docs/staging.md"
          exit 1

      - name: التحقق من الأسرار
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ]; then
            echo "::error::سرّ ناقص في Settings ← Secrets and variables ← Actions: NETLIFY_AUTH_TOKEN"
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: تثبيت المكتبات
        run: npm ci

      - name: فحص الأخطاء البرمجية (oxlint)
        run: npm run lint

      - name: فحص دوال Netlify
        run: npm run check:functions

      # يبني بمتغيرات الموقع التجريبي في Netlify (قاعدة البيانات التجريبية وVITE_STAGING)
      # عند الفشل تظهر آخر أسطر الخطأ في ملخص التشغيل نفسه، بلا فتح السجل الكامل
      - name: البناء والنشر
        run: |
          set +e
          npx --yes netlify-cli@27.10.2 deploy --prod --message "تجريبي ${GITHUB_REF_NAME} ${GITHUB_SHA::7}" 2>&1 | tee /tmp/deploy.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "::error title=فشل النشر::$(tail -40 /tmp/deploy.log | sed 's/\x1b\[[0-9;]*m//g' | sed ':a;N;$!ba;s/\n/%0A/g')"
          fi
          exit "$status"
